<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticino Academy - Christmas Lottery 2026</title>
    
    <!-- LIBRERIE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* === VARIABILI E FONT ELEGANTI === */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --bg-dark: #0a110a;
            --bg-panel: #142018;
            --gold: #d4af37;
            --gold-light: #f8e596;
            --red-xmas: #c41e3a;
            --text-light: #e0e0e0;
            --glass-border: rgba(212, 175, 55, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; }

        /* === SFONDO NOTTE STELLATA === */
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08), transparent 25%);
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 50px;
            position: relative;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 200px 200px;
            opacity: 0.3; pointer-events: none;
        }

        /* === HEADER LOCANDINA === */
        header { text-align: center; padding: 40px 20px 20px; position: relative; z-index: 1; }
        header .tennis-xmas { font-size: 40px; margin-bottom: -15px; display: inline-block; transform: rotate(-15deg); }
        header h1 { 
            font-family: 'Playfair Display', serif; font-size: 65px; font-weight: 700; 
            color: var(--gold); line-height: 1; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin: 0; letter-spacing: 2px;
        }
        header .anno { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold); letter-spacing: 5px; margin-bottom: 10px; }
        header .sottotitolo { font-family: 'Dancing Script', cursive; font-size: 32px; color: var(--gold-light); text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; position: relative; z-index: 1; }

        /* === DASHBOARD STATISTICHE === */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-box { background: rgba(10, 17, 10, 0.6); border: 1px solid var(--gold); border-radius: 5px; padding: 20px; text-align: center; box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.05); }
        .stat-valore { font-family: 'Playfair Display', serif; font-size: 38px; color: var(--gold); }
        .stat-etichetta { font-size: 12px; color: var(--gold-light); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 5px; }

        /* === TABELLONE === */
        .tabellone {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 12px;
            padding: 30px; background: rgba(20, 32, 24, 0.8); border-radius: 10px;
            border: 1px solid var(--glass-border); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .numero {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700;
            border-radius: 5px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.1);
        }
        .numero:not(.disabilitato):hover { transform: scale(1.08); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); border-color: var(--gold); z-index: 2;}
        
        /* Stati Numeri */
        .libero { background: #1a2a1f; color: #8fa395; }
        .venduto { background: var(--red-xmas); color: white; border-color: #ff4d6d; }
        .special { background: var(--gold); color: #000; border-color: #fff; box-shadow: 0 0 10px rgba(212,175,55,0.5); }
        
        /* === PANNELLO ADMIN === */
        .admin-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #000; padding: 15px 30px;
            display: none; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--gold); z-index: 100;
        }
        .admin-info { display: flex; gap: 15px; align-items: center; font-size: 14px; color: var(--gold-light);}
        .admin-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* === FINESTRA MODALE === */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            z-index: 200; display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--bg-panel); color: var(--gold-light);
            width: 90%; max-width: 450px; border-radius: 5px; padding: 35px;
            border: 1px solid var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        .modal-header { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--gold); border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between;}
        .modal-body { display: flex; flex-direction: column; gap: 15px; }
        .modal-body label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); }
        .modal-body input, .modal-body select { padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white; border-radius: 3px; font-size: 16px; }
        .modal-body input:focus, .modal-body select:focus { outline: none; border-color: var(--gold); }
        .modal-footer { margin-top: 30px; display: flex; gap: 10px; justify-content: flex-end; }

        /* === AREA ESTRAZIONE LIVE === */
        .area-estrazione {
            text-align: center; padding: 40px; margin-bottom: 40px;
            background: radial-gradient(circle at center, #1a080a 0%, #000 100%);
            border: 1px solid var(--gold); border-radius: 5px; display: none;
            box-shadow: inset 0 0 50px rgba(196, 30, 58, 0.2), 0 0 20px rgba(212,175,55,0.2);
        }
        .numero-estratto { font-family: 'Playfair Display', serif; font-size: 100px; color: var(--gold); text-shadow: 0 0 20px rgba(212,175,55,0.5); margin: 10px 0; }
        .titolo-premio { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold-light); letter-spacing: 3px; text-transform: uppercase;}
        .nome-vincitore { font-size: 24px; color: white; margin-top: 10px; display: none;}

        /* === BOTTONI === */
        button { padding: 12px 20px; border-radius: 3px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; border: 1px solid transparent; text-transform: uppercase; letter-spacing: 1px; font-family: 'Poppins', sans-serif; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-gold { background-color: var(--gold); color: #000; }
        .btn-gold:not(:disabled):hover { background-color: #b5952f; }
        .btn-dark { background-color: transparent; color: var(--gold); border-color: var(--gold); }
        .btn-dark:not(:disabled):hover { background-color: rgba(212,175,55,0.1); }
        .btn-red { background-color: var(--red-xmas); color: white; }
        .header-btn { position: absolute; top: 20px; right: 20px; padding: 8px 15px; font-size: 12px; background: transparent; color: var(--gold); border: 1px solid var(--gold); }
        .header-btn:hover { background: rgba(212,175,55,0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="tennis-xmas">🎾🎅</div>
        <h1>CHRISTMAS<br>LOTTERY</h1>
        <div class="anno">2026</div>
        <div class="sottotitolo">Un natale, tante possibilità di vincere!</div>
        
        <div>
            <span id="admin-status-label" style="display:none; color: var(--red-xmas); position: absolute; top: 20px; right: 80px; font-size: 12px; letter-spacing: 1px;">MODO SEGRETERIA</span>
            <button id="btn-logout" class="header-btn hidden" style="border-color: var(--red-xmas); color: var(--red-xmas);" onclick="eseguiLogout()">Esci</button>
        </div>
    </header>

    <div class="container">
        <div class="dashboard">
            <div class="stat-box">
                <div class="stat-valore">90</div>
                <div class="stat-etichetta">Biglietti Totali</div>
            </div>
            <div class="stat-box">
                <div class="stat-valore" id="stat-venduti">0</div>
                <div class="stat-etichetta">Venduti</div>
            </div>
            <div class="stat-box">
                <div class="stat-valore" id="stat-liberi">90</div>
                <div class="stat-etichetta">Liberi</div>
            </div>
            <div class="stat-box" style="border-color: var(--gold); box-shadow: inset 0 0 30px rgba(212,175,55,0.15);">
                <div class="stat-valore" id="stat-special">0</div>
                <div class="stat-etichetta" style="color: var(--gold);">Special One</div>
            </div>
            <div class="stat-box" id="box-incasso" style="display:none; border-color: #4CAF50;">
                <div class="stat-valore" id="stat-incasso" style="color: #4CAF50;">0 €</div>
                <div class="stat-etichetta">Incasso</div>
            </div>
        </div>

        <div id="area-estrazione" class="area-estrazione">
            <div id="titolo-premio" class="titolo-premio">ESTRAZIONE IN CORSO...</div>
            <div id="numero-estratto" class="numero-estratto">--</div>
            <div id="nome-vincitore" class="nome-vincitore">--</div>
        </div>

        <div id="tabellone" class="tabellone"></div>
    </div>

    <!-- BARRA ADMIN FISSA -->
    <div id="admin-bar" class="admin-bar">
        <div class="admin-info">
            <span style="color: var(--red-xmas);">⚙️ SEGRETERIA</span>
            <span>Vendite: <span id="stato-vendite-testo" style="color: #4CAF50;">APERTE</span></span>
        </div>
        <div class="admin-actions">
            <button id="btn-ricomincia-lotteria" class="btn-dark" style="border-color: var(--red-xmas); color: var(--red-xmas);" onclick="ricominciaLotteria()">Ricomincia Lotteria</button>
            <button id="btn-chiudi-vendite" class="btn-dark" onclick="chiudiVendite()">Chiudi Vendite</button>
            <button id="btn-estrazione-normale" class="btn-dark" onclick="estraiNumero('Normale')" disabled>Estrai Normale</button>
            <button id="btn-estrazione-special" class="btn-gold" onclick="estraiNumero('Special')" disabled>Estrai Special One</button>
        </div>
    </div>

    <!-- MODALE VENDITA -->
    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-content" class="modal-content">
            <div class="modal-header">
                Registra
                <span id="modal-num-display">#</span>
            </div>
            <div class="modal-body">
                <label>Acquirente</label>
                <input type="text" id="input-nome" autocomplete="off" placeholder="Nome e Cognome">
                
                <label>Tipo Partecipazione</label>
                <select id="select-tipo">
                    <option value="normale">Biglietto Normale (5 €)</option>
                    <option value="special">The Special One (7 €)</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-dark" onclick="annullaAcquisto()">Annulla</button>
                <button class="btn-gold" onclick="confermaAcquisto()">Conferma</button>
            </div>
        </div>
    </div>

    <script>
        // === CONFIGURAZIONE FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyC9PIZtz7riKI6dlx0oI8-TbPF9TlhSwDU",
            authDomain: "lotteria-ticinoacademy.firebaseapp.com",
            databaseURL: "https://lotteria-ticinoacademy-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lotteria-ticinoacademy",
            storageBucket: "lotteria-ticinoacademy.firebasestorage.app",
            messagingSenderId: "694794674399",
            appId: "1:694794674399:web:787bad94c3f4385c32096a",
            measurementId: "G-9PBGHDWLVZ"
        };

        // Inizializza Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dbRef = db.ref('lotteria_2026_data'); // Percorso nel database

        let statoApp = { biglietti: {}, venditeAperte: true, isAdmin: false, numeroInSelezione: null, ultimoEstratto: null };

        // === LISTENER SEGRETO PER LOGIN (SEQUENZA NUMERICA "7777") ===
        const sequenzaSegreta = "7777";
        let sequenzaDigitata = "";

        document.addEventListener('keydown', function(e) {
            if (e.key.length === 1) {
                sequenzaDigitata += e.key;
                if (sequenzaDigitata.length > sequenzaSegreta.length) {
                    sequenzaDigitata = sequenzaDigitata.slice(-sequenzaSegreta.length);
                }
                if (sequenzaDigitata === sequenzaSegreta) {
                    if (!statoApp.isAdmin) { eseguiLogin(); }
                    sequenzaDigitata = ""; 
                }
            }
        });

        function inizializzaBigliettiVuoti() {
            let temp = {};
            for (let i = 1; i <= 90; i++) { temp[i] = { stato: 'libero', nome: '', tipo: '' }; }
            return temp;
        }

        // ASCOLTA IL DATABASE IN TEMPO REALE
        function avviaSincronizzazione() {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    statoApp.biglietti = data.biglietti || inizializzaBigliettiVuoti();
                    statoApp.venditeAperte = data.venditeAperte !== undefined ? data.venditeAperte : true;
                    statoApp.ultimoEstratto = data.ultimoEstratto || null;
                    aggiornaInterfaccia();
                } else {
                    // Se il database è vuoto, lo inizializziamo
                    statoApp.biglietti = inizializzaBigliettiVuoti();
                    if (statoApp.isAdmin) { salvaDati(); } 
                    else { aggiornaInterfaccia(); }
                }
            });
        }

        function salvaDati() {
            // Solo l'admin può modificare il database globale
            if (statoApp.isAdmin) {
                dbRef.set({
                    biglietti: statoApp.biglietti, 
                    venditeAperte: statoApp.venditeAperte, 
                    ultimoEstratto: statoApp.ultimoEstratto || null
                });
            }
        }

        function aggiornaInterfaccia() {
            renderTabellone(); calcolaStatistiche(); gestisciVisibilitaAdmin(); mostraEstrazione();
        }

        function renderTabellone() {
            const container = document.getElementById('tabellone');
            container.innerHTML = '';
            for (let i = 1; i <= 90; i++) {
                const b = statoApp.biglietti[i];
                const div = document.createElement('div');
                div.classList.add('numero', b.stato);
                div.innerText = i;
                div.title = b.stato === 'libero' ? "Libero" : (statoApp.isAdmin ? `Venduto a: ${b.nome}` : "Venduto");
                div.onclick = () => handleClickNumero(i);
                container.appendChild(div);
            }
        }

        function calcolaStatistiche() {
            let venduti = 0, special = 0, incasso = 0;
            for (let i = 1; i <= 90; i++) {
                const b = statoApp.biglietti[i];
                if (b.stato !== 'libero') {
                    venduti++; incasso += (b.tipo === 'special' ? 7 : 5);
                    if (b.stato === 'special') special++;
                }
            }
            document.getElementById('stat-venduti').innerText = venduti;
            document.getElementById('stat-liberi').innerText = 90 - venduti;
            document.getElementById('stat-special').innerText = special;
            document.getElementById('stat-incasso').innerText = incasso + ' €';

            document.getElementById('btn-estrazione-normale').disabled = statoApp.venditeAperte || venduti === 0;
            document.getElementById('btn-estrazione-special').disabled = statoApp.venditeAperte || special < 15;
            
            const btnChiudi = document.getElementById('btn-chiudi-vendite');
            const testoStato = document.getElementById('stato-vendite-testo');
            
            if(!statoApp.venditeAperte) {
                btnChiudi.innerText = "VENDITE CHIUSE";
                btnChiudi.disabled = true;
                btnChiudi.style.borderColor = "var(--red-xmas)";
                btnChiudi.style.color = "var(--red-xmas)";
                testoStato.innerText = "CHIUSE"; 
                testoStato.style.color = "var(--red-xmas)";
            } else {
                btnChiudi.innerText = "Chiudi Vendite";
                btnChiudi.disabled = false;
                btnChiudi.style.borderColor = "var(--gold)";
                btnChiudi.style.color = "var(--gold)";
                testoStato.innerText = "APERTE"; 
                testoStato.style.color = "#4CAF50";
            }
        }

        function gestisciVisibilitaAdmin() {
            document.getElementById('admin-bar').style.display = statoApp.isAdmin ? 'flex' : 'none';
            document.getElementById('box-incasso').style.display = statoApp.isAdmin ? 'block' : 'none';
            document.getElementById('btn-logout').classList.toggle('hidden', !statoApp.isAdmin);
            document.getElementById('admin-status-label').style.display = statoApp.isAdmin ? 'inline-block' : 'none';
        }

        function mostraEstrazione() {
            const area = document.getElementById('area-estrazione');
            if (statoApp.ultimoEstratto) {
                area.style.display = 'block';
                document.getElementById('titolo-premio').innerText = statoApp.ultimoEstratto.tipoPremio;
                document.getElementById('numero-estratto').innerText = statoApp.ultimoEstratto.numero;
                const nomeDiv = document.getElementById('nome-vincitore');
                if(statoApp.isAdmin) { nomeDiv.style.display = 'block'; nomeDiv.innerText = "Vincitore: " + statoApp.ultimoEstratto.nome; }
                else { nomeDiv.style.display = 'none'; }
            } else { area.style.display = 'none'; }
        }

        function eseguiLogin() {
            if(prompt("Password Admin:") === 'admin123') { 
                statoApp.isAdmin = true; 
                aggiornaInterfaccia(); 
                salvaDati(); // Per forzare la prima creazione del db se non c'è
            }
        }

        function eseguiLogout() {
            statoApp.isAdmin = false; annullaAcquisto(); aggiornaInterfaccia();
        }

        function handleClickNumero(num) {
            if (!statoApp.isAdmin || !statoApp.venditeAperte) return;
            const b = statoApp.biglietti[num];
            if (b.stato === 'libero') {
                apriModale(num);
            } else {
                if(confirm(`ATTENZIONE: Il biglietto #${num} è assegnato a "${b.nome}".\n\nVuoi annullare questa vendita e liberare il numero?`)) {
                    statoApp.biglietti[num] = { stato: 'libero', nome: '', tipo: '' };
                    salvaDati();
                }
            }
        }

        function apriModale(num) {
            statoApp.numeroInSelezione = num;
            document.getElementById('modal-num-display').innerText = "#" + num;
            document.getElementById('input-nome').value = '';
            document.getElementById('select-tipo').value = 'normale';
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('input-nome').focus();
        }

        function annullaAcquisto() {
            document.getElementById('modal-overlay').style.display = 'none';
            statoApp.numeroInSelezione = null;
        }

        function confermaAcquisto() {
            const nome = document.getElementById('input-nome').value.trim();
            const tipo = document.getElementById('select-tipo').value;
            if(!nome) return;
            statoApp.biglietti[statoApp.numeroInSelezione] = { stato: (tipo === 'special' ? 'special' : 'venduto'), nome, tipo };
            annullaAcquisto(); salvaDati();
        }

        function chiudiVendite() {
            if(confirm("Chiudere le vendite definitivamente? Non potrai più aggiungere o rimuovere numeri.")) { 
                statoApp.venditeAperte = false; salvaDati(); 
            }
        }

        function estraiNumero(tipo) {
            const candidati = [];
            for(let i=1; i<=90; i++) {
                const b = statoApp.biglietti[i];
                if(b.stato !== 'libero' && (tipo === 'Normale' || b.stato === 'special')) candidati.push(i);
            }
            if(candidati.length === 0) return;
            
            // Effetto suspense simulato
            document.getElementById('area-estrazione').style.display = 'block';
            document.getElementById('titolo-premio').innerText = "ESTRAZIONE IN CORSO...";
            document.getElementById('numero-estratto').innerText = "??";
            document.getElementById('nome-vincitore').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
                const vincente = candidati[Math.floor(Math.random() * candidati.length)];
                statoApp.ultimoEstratto = {
                    numero: vincente, nome: statoApp.biglietti[vincente].nome,
                    tipoPremio: tipo === 'Special' ? 'THE SPECIAL ONE' : 'PREMIO PRINCIPALE'
                };
                salvaDati(); 
            }, 1500); // 1.5 secondi di finta attesa
        }

        function ricominciaLotteria() {
            if(confirm("ATTENZIONE CRITICA!\n\nVuoi davvero RICOMINCIARE la lotteria da zero?\nQuesta azione ELIMINERÀ TUTTI I BIGLIETTI VENDUTI e l'azione è IRREVERSIBILE. Confermi?")) {
                statoApp.biglietti = inizializzaBigliettiVuoti();
                statoApp.ultimoEstratto = null;
                statoApp.venditeAperte = true;
                salvaDati();
            }
        }

        // Avvio: si collega al database e carica i dati
        avviaSincronizzazione();
    </script>
</body>
</html>
